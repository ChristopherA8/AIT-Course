<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 4</title>
    <style>
      code {
        background-color: lightgray;
      }

      code:before {
        content: "<";
      }

      code:after {
        content: ">";
      }
    </style>
  </head>
  <body>
    <a href="https://apple.com">Apple.com</a>
    <ul>
      <li>
        <p>
          <code>ul</code> They used an unordered list in their website footer
          <br />
          <img height="100" width="400" src="assets/apple.png" />
        </p>
      </li>
    </ul>
    <a href="https://algebra.hr">Algebra.hr</a>
    <ul>
      <li>
        <p>
          <code>a</code> They used an anchor tag in their footer to link to
          another page on the site
          <br />
          <img height="100" width="400" src="assets/algebra.png" />
        </p>
      </li>
    </ul>
    <a href="https://github.com/ChristopherA8">Github.com</a>
    <ul>
      <li>
        <p>
          <code>p</code> They used a paragraph tag to display a text paragraph
          on their site
          <br />
          <img height="200" width="400" src="assets/github.png" />
        </p>
      </li>
    </ul>
  </body>
</html>
