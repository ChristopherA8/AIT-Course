<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 05</title>
    <style>
      body {
        font-family: system-ui;
      }
    </style>
  </head>
  <body>
    <form>
      <fieldset>
        <label for="name">Name: </label>
        <input id="name" placeholder="Enter name..." type="text" />
        <br /><br />
        <label for="surname">Surname: </label>
        <input id="surname" placeholder="Enter surname..." type="text" />
        <br /><br />
        <label for="address">Address: </label>
        <input id="address" placeholder="Address..." type="text" />
        <br /><br />
        <label for="hNumber">House number: </label>
        <input id="hNumber" value="1" type="number" />
        <br /><br />
        <label for="email">E-mail: </label>
        <input id="email" placeholder="Enter e-mail..." type="email" />
        <br /><br />
        <label for="dob">Date of birth: </label>
        <input id="dob" type="date" />
        <br /><br />
        <label for="color">Favorite color: </label>
        <input id="color" type="color" />
        <br /><br />
        <input type="submit" />
        <input type="reset" />
      </fieldset>
    </form>
  </body>
</html>
